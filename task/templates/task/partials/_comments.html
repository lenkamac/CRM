{% load static %}
<link rel="stylesheet" href="{% static 'task/task.css' %}">

{% for comment in comments %}
  <div class="task-comment" data-comment-id="{{ comment.id }}">
    <div class="comment mb-3 pb-3 border-bottom">
      <div class="d-flex align-items-start">
        <strong>@{{ comment.created_by.username }}</strong>
        <small class="text-muted ms-3">{{ comment.created_at|date:"d.m.Y H:i" }}</small>
      </div>
      <p class="comment-content mt-0 pt-1" id="comment-content-{{ comment.id }}">{{ comment.content|linebreaks }}</p>
      <!-- ...edit/delete buttons as before -->
        <button class="btn-task-delete px-3 bg-danger fw-bolder" data-comment-id="{{ comment.id }}" onclick="return confirm('Are you sure you want to delete this comment?');">Delete</button>
        <button class="btn-task-comment px-3 mx-2 text-bg-warning" data-comment-id="{{ comment.id }}">Edit</button>

        <form class="edit-comment-form" id="edit-comment-form-{{ comment.id }}" style="display: none;">
            <textarea name="content" id="edit-comment-textarea-{{ comment.id }}">{{ comment.content }}</textarea>
            <button type="button" class="save-comment-btn" data-comment-id="{{ comment.id }}">Save</button>
        </form>
    </div>
  </div>
{% empty %}
  <p class="text-muted">No comments yet.</p>
{% endfor %}
